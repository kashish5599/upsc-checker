[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pymupdf>=1.26.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
