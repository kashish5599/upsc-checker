[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "langchain>=1.4.2",
    "langchain-google-genai>=4.0.0",
    "langfuse>=4.15.6",
    "pinecone>=7.0.0",
    "pdfminer-six>=20221105",
    "pymupdf>=1.26.0",
    "python-multipart>=0.0.32",
    "unstructured>=0.27.8,<0.28",
    "uvicorn>=0.53.0",
    "pi-heif>=1.4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
